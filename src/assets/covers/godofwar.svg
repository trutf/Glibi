<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Rich dynamic gradients -->
    <linearGradient id="bg_godofwar" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0c1b2f" />
      <stop offset="45%" stop-color="#06101e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <radialGradient id="vignette_godofwar" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4dabf7" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </radialGradient>

    <linearGradient id="overlay_godofwar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.96" />
    </linearGradient>

    <!-- Subtle Grain / Stripe pattern for AAA poster texture -->
    <pattern id="lines_godofwar" width="100" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#ffffff" stroke-opacity="0.018" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Layers -->
  <rect width="600" height="900" fill="url(#bg_godofwar)" />
  <rect width="600" height="900" fill="url(#vignette_godofwar)" />
  <rect width="600" height="900" fill="url(#lines_godofwar)" />

  <!-- Outer cinematic borders -->
  <rect x="18" y="18" width="564" height="864" fill="none" stroke="#4dabf7" stroke-opacity="0.22" stroke-width="1.5" />
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- Top Header bar -->
  <g transform="translate(42, 58)">
    <circle cx="6" cy="6" r="4" fill="#4dabf7" />
    <text x="20" y="10" fill="#4dabf7" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="3">MYTHIC ACTION</text>
    <text x="516" y="10" text-anchor="end" fill="#777777" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">SANTA MONICA</text>
  </g>

  <!-- Central Artwork Motif -->
  
        <!-- Norse Rune & Omega Circle -->
        <circle cx="300" cy="370" r="165" fill="none" stroke="#4dabf7" stroke-width="4" stroke-opacity="0.4" />
        <path d="M 210 480 A 130 130 0 1 1 390 480 L 430 480 L 410 430 A 100 100 0 1 0 190 430 L 170 480 Z" fill="#4dabf7" fill-opacity="0.85" />
        <!-- Frost Ice Glow -->
        <polygon points="300,260 315,350 300,430 285,350" fill="#e7f5ff" fill-opacity="0.9" />
        <line x1="230" y1="350" x2="370" y2="350" stroke="#e7f5ff" stroke-width="3" stroke-opacity="0.8" />
        

  <!-- Lighting & Shadow Overlays -->
  <rect width="600" height="900" fill="url(#overlay_godofwar)" />

  <!-- Atmospheric quote/lore tag -->
  <text x="300" y="640" text-anchor="middle" fill="#aaaaaa" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="4">FOR THE NINE REALMS</text>

  <!-- Bottom Hero Typography (Steam/GOG Master Art Style) -->
  <g transform="translate(42, 730)">
    <!-- Decorative glow bar -->
    <rect x="0" y="-35" width="46" height="3" fill="#4dabf7" rx="1.5" />
    
    <!-- Main Title -->
    <text x="0" y="10" fill="#ffffff" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="1">GOD OF WAR</text>
    
    <!-- Subtitle -->
    <text x="2" y="44" fill="#e7f5ff" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">RAGNARÖK</text>
    
    <!-- Status / Ready Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="86" height="22" rx="3" fill="#4dabf7" fill-opacity="0.2" stroke="#4dabf7" stroke-opacity="0.6" stroke-width="1" />
      <text x="43" y="15" text-anchor="middle" fill="#e7f5ff" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">READY</text>
    </g>
  </g>
</svg>