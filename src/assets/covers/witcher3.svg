<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Rich dynamic gradients -->
    <linearGradient id="bg_witcher3" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#181010" />
      <stop offset="45%" stop-color="#0f0808" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <radialGradient id="vignette_witcher3" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c92a2a" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </radialGradient>

    <linearGradient id="overlay_witcher3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.96" />
    </linearGradient>

    <!-- Subtle Grain / Stripe pattern for AAA poster texture -->
    <pattern id="lines_witcher3" width="100" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#ffffff" stroke-opacity="0.018" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Layers -->
  <rect width="600" height="900" fill="url(#bg_witcher3)" />
  <rect width="600" height="900" fill="url(#vignette_witcher3)" />
  <rect width="600" height="900" fill="url(#lines_witcher3)" />

  <!-- Outer cinematic borders -->
  <rect x="18" y="18" width="564" height="864" fill="none" stroke="#c92a2a" stroke-opacity="0.22" stroke-width="1.5" />
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- Top Header bar -->
  <g transform="translate(42, 58)">
    <circle cx="6" cy="6" r="4" fill="#c92a2a" />
    <text x="20" y="10" fill="#c92a2a" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="3">OPEN WORLD STORY</text>
    <text x="516" y="10" text-anchor="end" fill="#777777" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">COMPLETE ED.</text>
  </g>

  <!-- Central Artwork Motif -->
  
        <!-- Witcher Wolf Medallion Geometry -->
        <circle cx="300" cy="380" r="170" fill="none" stroke="#c92a2a" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 6" />
        <polygon points="300,240 390,320 370,450 300,530 230,450 210,320" fill="none" stroke="#c92a2a" stroke-width="3.5" stroke-opacity="0.8" />
        <polygon points="300,280 350,340 330,440 300,480 270,440 250,340" fill="#c92a2a" fill-opacity="0.15" stroke="#ffa94d" stroke-width="2" />
        <polygon points="260,360 285,385 255,400" fill="#ffa94d" />
        <polygon points="340,360 315,385 345,400" fill="#ffa94d" />
        

  <!-- Lighting & Shadow Overlays -->
  <rect width="600" height="900" fill="url(#overlay_witcher3)" />

  <!-- Atmospheric quote/lore tag -->
  <text x="300" y="640" text-anchor="middle" fill="#aaaaaa" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="4">THE PATH BECKONS</text>

  <!-- Bottom Hero Typography (Steam/GOG Master Art Style) -->
  <g transform="translate(42, 730)">
    <!-- Decorative glow bar -->
    <rect x="0" y="-35" width="46" height="3" fill="#c92a2a" rx="1.5" />
    
    <!-- Main Title -->
    <text x="0" y="10" fill="#ffffff" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="1">THE WITCHER 3</text>
    
    <!-- Subtitle -->
    <text x="2" y="44" fill="#ffa94d" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">WILD HUNT</text>
    
    <!-- Status / Ready Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="86" height="22" rx="3" fill="#c92a2a" fill-opacity="0.2" stroke="#c92a2a" stroke-opacity="0.6" stroke-width="1" />
      <text x="43" y="15" text-anchor="middle" fill="#ffa94d" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">READY</text>
    </g>
  </g>
</svg>