<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Rich dynamic gradients -->
    <linearGradient id="bg_cyberpunk2077" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1f0927" />
      <stop offset="45%" stop-color="#0b0c10" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <radialGradient id="vignette_cyberpunk2077" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </radialGradient>

    <linearGradient id="overlay_cyberpunk2077" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.96" />
    </linearGradient>

    <!-- Subtle Grain / Stripe pattern for AAA poster texture -->
    <pattern id="lines_cyberpunk2077" width="100" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#ffffff" stroke-opacity="0.018" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Layers -->
  <rect width="600" height="900" fill="url(#bg_cyberpunk2077)" />
  <rect width="600" height="900" fill="url(#vignette_cyberpunk2077)" />
  <rect width="600" height="900" fill="url(#lines_cyberpunk2077)" />

  <!-- Outer cinematic borders -->
  <rect x="18" y="18" width="564" height="864" fill="none" stroke="#00f0ff" stroke-opacity="0.22" stroke-width="1.5" />
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- Top Header bar -->
  <g transform="translate(42, 58)">
    <circle cx="6" cy="6" r="4" fill="#00f0ff" />
    <text x="20" y="10" fill="#00f0ff" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="3">OPEN WORLD RPG</text>
    <text x="516" y="10" text-anchor="end" fill="#777777" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">2077</text>
  </g>

  <!-- Central Artwork Motif -->
  
        <!-- Cyberpunk Grid & Neon lines -->
        <pattern id="grid_cp" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
        </pattern>
        <rect width="600" height="900" fill="url(#grid_cp)" />
        <line x1="80" y1="200" x2="520" y2="200" stroke="#fee801" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 4" />
        <circle cx="300" cy="380" r="160" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3" />
        <circle cx="300" cy="380" r="190" fill="none" stroke="#fee801" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="12 8" />
        <!-- Cyber Katana / Samurai emblem -->
        <polygon points="300,240 370,360 300,340 230,360" fill="#00f0ff" fill-opacity="0.8" />
        <polygon points="300,520 370,400 300,420 230,400" fill="#fee801" fill-opacity="0.9" />
        <rect x="290" y="310" width="20" height="140" fill="#ffffff" rx="4" />
        

  <!-- Lighting & Shadow Overlays -->
  <rect width="600" height="900" fill="url(#overlay_cyberpunk2077)" />

  <!-- Atmospheric quote/lore tag -->
  <text x="300" y="640" text-anchor="middle" fill="#aaaaaa" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="4">WAKE UP, SAMURAI</text>

  <!-- Bottom Hero Typography (Steam/GOG Master Art Style) -->
  <g transform="translate(42, 730)">
    <!-- Decorative glow bar -->
    <rect x="0" y="-35" width="46" height="3" fill="#00f0ff" rx="1.5" />
    
    <!-- Main Title -->
    <text x="0" y="10" fill="#ffffff" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="1">CYBERPUNK</text>
    
    <!-- Subtitle -->
    <text x="2" y="44" fill="#fee801" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">2077</text>
    
    <!-- Status / Ready Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="86" height="22" rx="3" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1" />
      <text x="43" y="15" text-anchor="middle" fill="#fee801" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">READY</text>
    </g>
  </g>
</svg>