<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Rich dynamic gradients -->
    <linearGradient id="bg_hades2" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#09231b" />
      <stop offset="45%" stop-color="#041410" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <radialGradient id="vignette_hades2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#20c997" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </radialGradient>

    <linearGradient id="overlay_hades2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.96" />
    </linearGradient>

    <!-- Subtle Grain / Stripe pattern for AAA poster texture -->
    <pattern id="lines_hades2" width="100" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#ffffff" stroke-opacity="0.018" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Layers -->
  <rect width="600" height="900" fill="url(#bg_hades2)" />
  <rect width="600" height="900" fill="url(#vignette_hades2)" />
  <rect width="600" height="900" fill="url(#lines_hades2)" />

  <!-- Outer cinematic borders -->
  <rect x="18" y="18" width="564" height="864" fill="none" stroke="#20c997" stroke-opacity="0.22" stroke-width="1.5" />
  <rect x="24" y="24" width="552" height="852" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- Top Header bar -->
  <g transform="translate(42, 58)">
    <circle cx="6" cy="6" r="4" fill="#20c997" />
    <text x="20" y="10" fill="#20c997" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="3">ROGUE-LIKE</text>
    <text x="516" y="10" text-anchor="end" fill="#777777" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">SUPERGIANT</text>
  </g>

  <!-- Central Artwork Motif -->
  
        <!-- Hades Underworld Magical sigils -->
        <circle cx="300" cy="380" r="160" fill="none" stroke="#20c997" stroke-width="2" stroke-opacity="0.4" />
        <circle cx="300" cy="380" r="130" fill="none" stroke="#ffd43b" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="10 6" />
        <!-- Crescent Moons & Dagger -->
        <path d="M 230 380 A 70 70 0 1 0 370 380 A 60 60 0 1 1 230 380 Z" fill="#20c997" fill-opacity="0.6" />
        <line x1="300" y1="210" x2="300" y2="550" stroke="#ffd43b" stroke-width="4" stroke-linecap="round" />
        <polygon points="300,190 320,240 280,240" fill="#ffd43b" />
        <circle cx="300" cy="380" r="28" fill="#ffd43b" fill-opacity="0.9" />
        

  <!-- Lighting & Shadow Overlays -->
  <rect width="600" height="900" fill="url(#overlay_hades2)" />

  <!-- Atmospheric quote/lore tag -->
  <text x="300" y="640" text-anchor="middle" fill="#aaaaaa" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="4">DEATH TO CHRONOS</text>

  <!-- Bottom Hero Typography (Steam/GOG Master Art Style) -->
  <g transform="translate(42, 730)">
    <!-- Decorative glow bar -->
    <rect x="0" y="-35" width="46" height="3" fill="#20c997" rx="1.5" />
    
    <!-- Main Title -->
    <text x="0" y="10" fill="#ffffff" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="1">HADES II</text>
    
    <!-- Subtitle -->
    <text x="2" y="44" fill="#ffd43b" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">THE UNSEEN REALM</text>
    
    <!-- Status / Ready Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="86" height="22" rx="3" fill="#20c997" fill-opacity="0.2" stroke="#20c997" stroke-opacity="0.6" stroke-width="1" />
      <text x="43" y="15" text-anchor="middle" fill="#ffd43b" font-family="DejaVu Sans, -apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5">INSTALLED</text>
    </g>
  </g>
</svg>